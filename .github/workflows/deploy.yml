name: "Build and deploy"
on: 
    workflow_dispatch
permissions: 
    contents: read
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repo
              uses: actions/checkout@v5
            - name: Set up Python
              uses: actions/setup-python@v6
              with: 
                python-version: '3.14'
            - name: Install dependencies
              run: pip install -r requirements.txt
            - name: Show versions
              run: |
                python --version
                pip list
            - name: Fetch data
              run: python scripts/fetch_data.py
            - name: Verification fetch
              run: ls -l apps/public/data
            - name: Install uv for marimo export
              run: python -m pip install uv
            - name: Export notebook to WASM
              run: python -m marimo export html-wasm apps/air_quality_analysis.py -o site --mode run
            - name: Verification export
              run: ls -l site/public/data

